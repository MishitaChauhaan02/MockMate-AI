services:
  # FastAPI Backend Web Service
  - type: web
    name: mockmate-ai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt && cd backend && alembic upgrade head
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mockmate-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: FRONTEND_URL
        sync: false

databases:
  # Managed PostgreSQL Database
  - name: mockmate-postgres
    databaseName: mockmate_db
    user: mockmate_user
    plan: free
